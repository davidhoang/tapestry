kind = "mobile"
previewPath = "/tapestry-mobile/"
title = "Tapestry Mobile"
version = "1.0.0"
id = "artifacts/tapestry-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/tapestry-mobile/" ]
localPort = 24858

[services.development]
run = "pnpm --filter @workspace/tapestry-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tapestry-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/tapestry-mobile", "run", "serve" ]

[services.env]
PORT = "24858"
BASE_PATH = "/tapestry-mobile/"
